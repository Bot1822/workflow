set -g default-shell /bin/zsh
set -g mouse on
set -g default-terminal "tmux-256color"

# Use OSC 52 for clipboard integration, allow TUI passthrough, and advertise
# truecolor to common clients.
set -s set-clipboard on
set -wg allow-passthrough on
set -s terminal-overrides "xterm-256color:Tc,tmux-256color:Tc,screen-256color:Tc,alacritty*:Tc,wezterm*:Tc,xterm-kitty:Tc,foot*:Tc,st-256color:Tc,rxvt-unicode-256color:Tc"

# Reduce Vim/Neovim Esc latency and enable focus events for plugins.
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Fast config reload and predictable split behavior in the current directory.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vi-style copy mode keeps navigation consistent with Vim/Neovim.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# tmux 3.0a does not support pane-border-lines or pane-border-indicators.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour45"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,ACTIVE,idle} #{pane_index} #{pane_current_command} "

setw -g window-style "fg=terminal,bg=colour235"
setw -g window-active-style "fg=terminal,bg=terminal"

# Cohesive status line theme to match the cyan/grey pane styling.
set -g status-style "fg=colour250,bg=colour234"
set -g status-justify centre
set -g status-left-length 48
set -g status-right-length 96
set -g message-style "fg=colour232,bg=colour45"
set -g message-command-style "fg=colour232,bg=colour81"
set -g mode-style "fg=colour232,bg=colour81"
set -g window-status-separator ""
set -g window-status-format "#[fg=colour244,bg=colour234] #I:#W#{?window_last_flag,*,} "
set -g window-status-current-format "#[fg=colour232,bg=colour45,bold] #I:#W#{?window_zoomed_flag,[Z],} #[fg=colour45,bg=colour234,nobold]"
set -g status-left "#{?client_prefix,#[fg=colour232#,bg=colour208#,bold] PREFIX #[fg=colour208#,bg=colour234#,nobold] ,}#[fg=colour232,bg=colour45,bold] #{session_name} #[fg=colour45,bg=colour234,nobold] #[fg=colour250,bg=colour234]L1 #(cut -d' ' -f1 /proc/loadavg) "
set -g status-right "#[fg=colour250,bg=colour234] %Y-%m-%d %H:%M #[fg=colour45,bg=colour234,bold]#h "
